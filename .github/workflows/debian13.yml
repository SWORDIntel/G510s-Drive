name: Debian 13 G510 LCD
on:
  push:
    branches: [master, modernize/debian13-g510-lcd]
  pull_request:
jobs:
  lcd-client:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build and renderer dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential libg15daemon-client-dev python3 python3-pil python3-evdev
      - name: Python syntax checks
        run: python3 -m compileall -q g510ctl g510lcd tests tools
      - name: Build LCD transport
        run: bash tools/build-debian.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate CLI output length
        run: |
          python3 -m g510lcd text "HELLO FROM DEBIAN 13" > /tmp/lcd.bin
          test "$(wc -c < /tmp/lcd.bin)" -eq 6880
          python3 -m g510lcd text "HELLO" --preview /tmp/lcd.png
  legacy-build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy build dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config patch bzip2 libusb-dev libfreetype-dev libgtop2-dev python3
      - name: Stage patched sources as unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su -s /bin/bash builder -c "cd '$GITHUB_WORKSPACE' && bash tools/build-legacy-debian.sh"
